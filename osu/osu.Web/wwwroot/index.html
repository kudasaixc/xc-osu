<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>xc-osu!</title>
  <meta name="description" content="xc-osu! — the full osu!lazer client running natively in your browser. Web port by xc softworks (kudasaixc).">
  <meta name="author" content="xc softworks (kudasaixc)">
  <link rel="preload" id="webassembly" />
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0b0b12">
  <script type="importmap"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b12; --panel: rgba(255,255,255,.035); --panel-2: rgba(255,255,255,.06); --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.14);
      --ink: #f2eaff; --ink-2: #c2b6d8; --ink-3: #8a7fa3; --pink: #ff66aa; --violet: #b46cff;
      --good: #4cc38a; --warn: #e8b04a; --bad: #ff6b6b;
      --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, Menlo, monospace;
      --sans: system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); overflow: hidden; overscroll-behavior: none; }
    #xc-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; touch-action: none; }
    button, input, select { font: inherit; color: inherit; }
    a { color: var(--pink); }
    .muted { color: var(--ink-3); } .small { font-size: 12px; }
    .xc-mark { font-weight: 800; letter-spacing: -.03em; color: var(--pink); }
    .ghost { background: transparent; border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 12px; cursor: pointer; color: var(--ink-2); }
    .ghost:hover { border-color: var(--pink); color: var(--ink); }
    .primary-sm { background: var(--pink); border: 0; border-radius: 8px; padding: 6px 14px; cursor: pointer; color: #fff; font-weight: 600; margin-right: 8px; }
    :focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }

    /* ------------------------------------------------------------ launcher */
    @font-face { font-family: 'Chakra Petch'; font-weight: 600; font-style: normal; font-display: swap; src: url(fonts/ChakraPetch-600.woff2) format('woff2'); }
    @font-face { font-family: 'Chakra Petch'; font-weight: 700; font-style: normal; font-display: swap; src: url(fonts/ChakraPetch-700.woff2) format('woff2'); }
    @font-face { font-family: 'IBM Plex Sans'; font-weight: 400 600; font-style: normal; font-display: swap; src: url(fonts/IBMPlexSans.woff2) format('woff2'); }
    #xc-launcher {
      --l-bg: #121722; --l-rail: #0c1018; --l-panel: rgba(18,23,34,.78); --l-panel-2: #1b2231; --l-edge: #252e40; --l-edge-2: #33405a;
      --l-ink: #e8ecf4; --l-ink-2: #a3adbf; --l-ink-3: #6c7890; --l-accent: #ff66aa; --l-accent-ink: #1a0f16;
      --l-good: #4cc38a; --l-warn: #e8b04a; --l-bad: #ff6b6b;
      --l-head: 'Chakra Petch', var(--sans); --l-body: 'IBM Plex Sans', var(--sans);
      position: fixed; inset: 0; z-index: 5; display: none; grid-template-columns: 84px 1fr; grid-template-rows: 1fr auto;
      background: var(--l-bg); color: var(--l-ink); font: 14.5px/1.55 var(--l-body); transition: opacity .4s; }
    #xc-launcher.show { display: grid; }
    #xc-launcher.gone { opacity: 0; pointer-events: none; }
    #xc-launcher h1, #xc-launcher h2, #xc-launcher h3, #xc-launcher .play, #xc-launcher .rail-logo { font-family: var(--l-head); }
    #xc-launcher .muted { color: var(--l-ink-3); }
    #xc-launcher .small { font-size: 12.5px; }
    #xc-launcher a { color: var(--l-accent); text-decoration: none; } #xc-launcher a:hover { text-decoration: underline; }
    .ln-bg { position: absolute; inset: 0 0 0 84px; width: calc(100% - 84px); height: 100%; pointer-events: none; z-index: 1; }
    .ln-art { position: absolute; inset: 0 0 0 84px; background: center / cover no-repeat; opacity: 0; transition: opacity 1.2s; }
    .ln-art.on { opacity: 1; }
    .ln-art::after { content: ''; position: absolute; inset: 0; background: rgba(13,17,26,.8); }
    .hello { margin: 14px 0 0; color: var(--l-ink); font-size: 14px; padding: 8px 14px; border-radius: 10px; background: rgba(255,102,170,.12); display: inline-block; }

    .rail { grid-row: 1 / 3; position: relative; z-index: 2; background: var(--l-rail); border-right: 1px solid var(--l-edge); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 0; }
    .rail-logo { will-change: transform; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--l-accent); color: var(--l-accent-ink); font-weight: 700; font-size: 20px; letter-spacing: -.02em; margin-bottom: 18px; }
    .rail-btn { position: relative; width: 68px; padding: 10px 0 8px; border: 0; border-radius: 12px; background: transparent; color: var(--l-ink-3); cursor: pointer; display: grid; justify-items: center; gap: 4px; font-size: 11.5px; transition: color .15s, background .15s; }
    .rail-btn svg { width: 24px; height: 24px; }
    .rail-btn:hover { color: var(--l-ink); background: rgba(255,255,255,.04); }
    .rail-btn.on { color: var(--l-ink); background: var(--l-panel-2); }
    .rail-btn.on::before { content: ''; position: absolute; left: -8px; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--l-accent); }

    .stage { position: relative; z-index: 2; min-height: 0; overflow-y: auto; padding: 36px 48px 40px; scrollbar-width: thin; scrollbar-color: var(--l-edge-2) transparent; }
    .pane { max-width: 1120px; }
    .pane-head { margin-bottom: 24px; max-width: 720px; }
    .pane-head.row { display: flex; align-items: center; justify-content: space-between; max-width: none; }
    .title { margin: 0; font-size: clamp(30px, 3.4vw, 44px); line-height: 1.05; font-weight: 700; letter-spacing: -.01em; }
    .title small { white-space: nowrap; font-size: .45em; font-weight: 600; color: var(--l-ink-3); margin-left: 14px; letter-spacing: 0; }
    .lede { margin: 12px 0 0; color: var(--l-ink-2); font-size: 16px; max-width: 60ch; }
    .grid-2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
    .stack { display: grid; gap: 16px; }
    .panel { background: var(--l-panel); border: 1px solid var(--l-edge); border-radius: 16px; padding: 20px 22px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .panel h2 { margin: 0 0 14px; font-size: 18px; font-weight: 600; }
    .panel h2 .muted { font-family: var(--l-body); font-size: 13px; font-weight: 400; margin-left: 6px; }
    .link { background: none; border: 0; padding: 0; margin-top: 14px; color: var(--l-accent); cursor: pointer; font-size: 13.5px; }
    .link:hover { text-decoration: underline; }
    .btn { border: 1px solid var(--l-edge-2); background: var(--l-panel-2); color: var(--l-ink); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
    .btn:hover { border-color: var(--l-ink-3); }

    .spec { margin: 0; display: grid; }
    .spec div { display: grid; grid-template-columns: 170px 1fr; gap: 12px; padding: 9px 0; border-top: 1px solid var(--l-edge); }
    .spec div:first-child { border-top: 0; padding-top: 0; }
    .spec dt { color: var(--l-ink-3); }
    .spec dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

    .posts { display: grid; gap: 16px; max-width: 760px; }
    .post-meta { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--l-ink-3); }
    .tag { font-size: 11.5px; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--l-edge-2); color: var(--l-ink-2); }
    .post h3 { margin: 6px 0 6px; font-size: 20px; font-weight: 600; }
    .post p { margin: 0; color: var(--l-ink-2); max-width: 68ch; }
    .post ul { margin: 10px 0 0; padding-left: 18px; color: var(--l-ink-2); }
    .post li { margin: 4px 0; }

    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--l-ink-3); }
    .st-done .dot, .sev-low .dot { background: var(--l-good); } .st-partial .dot, .sev-medium .dot { background: var(--l-warn); } .sev-high .dot { background: var(--l-bad); }
    .sev-low .dot { background: var(--l-ink-3); }
    .meter-top { display: flex; align-items: baseline; justify-content: space-between; }
    .meter-top b { font-family: var(--l-head); font-size: 34px; font-weight: 700; }
    .meter-bar { height: 8px; border-radius: 8px; background: var(--l-panel-2); overflow: hidden; margin: 10px 0 8px; }
    .meter-bar i { display: block; height: 100%; border-radius: 8px; background: var(--l-accent); }
    .meter p { margin: 0 0 14px; }
    table { width: 100%; border-collapse: collapse; }
    .port td { padding: 8px 0; border-top: 1px solid var(--l-edge); vertical-align: top; }
    .port td:first-child { width: 22px; padding-top: 14px; }
    .port .ps { text-align: right; color: var(--l-ink-3); font-size: 13px; white-space: nowrap; padding-left: 12px; }
    .port .st-todo td:nth-child(2) { color: var(--l-ink-3); }
    .issues { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
    .issues li { display: grid; grid-template-columns: 12px 1fr; gap: 10px; }
    .issues .dot { margin-top: 8px; }
    .iss-title { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .iss-title strong { font-weight: 600; }
    .sev { font-size: 12.5px; color: var(--l-ink-3); }
    .issues p { margin: 2px 0 0; color: var(--l-ink-2); font-size: 13.5px; }
    .issue-mini { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .issue-mini li { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; }
    .kept { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .kept b { font-family: var(--l-head); font-size: 28px; font-weight: 700; } .kept span { color: var(--l-ink-2); font-size: 13px; }
    .trees { font-size: 13px; margin-bottom: 10px; }
    .trees th { text-align: left; font-weight: 500; color: var(--l-ink-3); padding: 0 0 6px; }
    .trees td { padding: 6px 0; border-top: 1px solid var(--l-edge); }
    .trees td:nth-child(2) { width: 42%; padding-right: 12px; }
    .trees .num { text-align: right; }
    .tbar { display: inline-block; vertical-align: middle; width: calc(100% - 64px); height: 6px; border-radius: 6px; background: var(--l-panel-2); overflow: hidden; }
    .tbar i { display: block; height: 100%; background: var(--l-accent); border-radius: 6px; }
    .tv { display: inline-block; width: 60px; text-align: right; font-variant-numeric: tabular-nums; }
    .sys { margin: 0; display: grid; gap: 7px; font-size: 13.5px; }
    .sys div { display: grid; grid-template-columns: 160px 1fr; gap: 12px; }
    .sys dt { color: var(--l-ink-3); } .sys dd { margin: 0; overflow-wrap: anywhere; }

    .presets { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 1px solid var(--l-edge-2); background: var(--l-panel); border-radius: 10px; padding: 7px 14px; cursor: pointer; color: var(--l-ink-2); }
    .chip:hover { color: var(--l-ink); border-color: var(--l-ink-3); }
    .chip.on { background: var(--l-accent); border-color: var(--l-accent); color: var(--l-accent-ink); font-weight: 600; }
    .chip.static { cursor: default; }
    .opt-grid { columns: 2 380px; column-gap: 16px; }
    .opt-sec { break-inside: avoid; margin-bottom: 16px; padding: 18px 0 6px; }
    .opt-sec h2 { padding: 0 20px; margin-bottom: 6px; }
    .opt { padding: 10px 20px 12px; position: relative; }
    .opt + .opt { border-top: 1px solid var(--l-edge); }
    .opt.mod::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--l-accent); }
    .opt label { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .opt output { color: var(--l-ink-2); font-variant-numeric: tabular-nums; }
    .opt .help { margin: 4px 0 0; font-size: 12.5px; color: var(--l-ink-3); line-height: 1.45; }
    .opt select, .opt input[type=url] { width: 100%; margin-top: 8px; background: var(--l-rail); border: 1px solid var(--l-edge-2); border-radius: 10px; padding: 8px 10px; }
    .opt input[type=range] { width: 100%; margin: 10px 0 0; accent-color: var(--l-accent); }
    .tog label { cursor: pointer; }
    .tog input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .sw { flex: none; width: 38px; height: 22px; border-radius: 999px; background: var(--l-edge-2); position: relative; transition: background .2s; }
    .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .tog input:checked + .sw { background: var(--l-accent); } .tog input:checked + .sw::after { transform: translateX(16px); }
    .tog input:focus-visible + .sw { outline: 2px solid var(--l-accent); outline-offset: 2px; }
    .cmd code { display: block; font: 12.5px/1.6 var(--mono); color: var(--l-ink-2); background: var(--l-rail); border-radius: 10px; padding: 12px 14px; overflow-wrap: anywhere; }

    .dock { grid-column: 2; position: relative; z-index: 2; display: flex; align-items: center; gap: 24px; padding: 16px 28px 16px 48px; background: var(--l-rail); border-top: 1px solid var(--l-edge); }
    .dock-bar { position: absolute; left: 0; right: 0; top: -1px; height: 3px; background: transparent; }
    .dock-bar i { display: block; height: 100%; width: 0; background: var(--l-accent); transition: width .3s; }
    #xc-launcher.dl-done .dock-bar i { background: var(--l-good); }
    .dock-dl { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; color: var(--l-ink-2); font-variant-numeric: tabular-nums; }
    .dock-dl strong { color: var(--l-ink); font-weight: 600; }
    .dock-dl .bad, .dock-dl.err strong { color: var(--l-bad); }
    .dock-right { display: flex; align-items: center; gap: 20px; }
    .dock-meta { display: grid; justify-items: end; font-size: 13px; color: var(--l-ink-2); }
    .play { min-width: 200px; padding: 14px 34px; border: 0; border-radius: 14px; cursor: pointer; font-size: 21px; font-weight: 700; letter-spacing: .01em;
      background: var(--l-accent); color: var(--l-accent-ink); transition: transform .12s, background .15s; }
    .play:hover { background: #ff7fb8; }
    .play:active { transform: translateY(1px); }
    .play:disabled { background: var(--l-edge-2); color: var(--l-ink-3); cursor: not-allowed; }
    #xc-launcher :focus-visible { outline: 2px solid var(--l-accent); outline-offset: 2px; }

    @media (max-width: 980px) { .grid-2 { grid-template-columns: 1fr; } .stage { padding: 28px 28px 32px; } .dock { padding-left: 28px; } }
    @media (max-width: 640px) {
      #xc-launcher { grid-template-columns: 1fr; grid-template-rows: 1fr auto auto; }
      .ln-bg { inset: 0; width: 100%; }
      .rail { grid-row: 3; flex-direction: row; justify-content: space-around; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); border-right: 0; border-top: 1px solid var(--l-edge); }
      .rail-logo { display: none; }
      .rail-btn.on::before { left: 18px; right: 18px; top: -7px; bottom: auto; width: auto; height: 3px; border-radius: 0 0 3px 3px; }
      .stage { padding: 22px 16px 24px; }
      .dock { grid-column: 1; grid-row: 2; padding: 12px 16px; gap: 12px; flex-wrap: wrap; }
      .dock-right { width: 100%; justify-content: space-between; } .play { min-width: 0; flex: 1; }
      .dock-meta { justify-items: start; }
      .spec div, .sys div { grid-template-columns: 1fr; gap: 0; }
      .opt-grid { columns: 1; }
    }

    /* ------------------------------------------------------------ verbose launch */
    #xc-boot { position: fixed; inset: 0; z-index: 6; display: none; flex-direction: column; background: rgba(8,8,14,.97); transition: opacity .6s; }
    #xc-boot.show { display: flex; } #xc-boot.gone { opacity: 0; pointer-events: none; }
    .boot-head { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 24px 10px; }
    .boot-title { display: flex; align-items: baseline; gap: 12px; } .boot-title .xc-mark { font-size: 22px; }
    .boot-sub { font: 12px var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; }
    .boot-clock { font: 13px var(--mono); color: var(--ink-2); }
    .boot-bar { height: 2px; background: var(--line); margin: 0 24px; }
    .boot-bar i { display: block; height: 100%; width: 0; background: var(--pink); transition: width .4s; }
    #xc-boot.failed .boot-bar i { background: var(--bad); }
    .boot-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 320px 1fr; gap: 0; padding: 16px 24px; }
    .boot-stages { list-style: none; margin: 0; padding: 0 20px 0 0; font-size: 13px; }
    .boot-stages li { display: grid; grid-template-columns: 18px 1fr auto; grid-template-rows: auto auto; column-gap: 8px; padding: 7px 0; color: var(--ink-3); }
    .st-icon { grid-row: 1 / 3; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink-3); margin-top: 5px; }
    .boot-stages .active { color: var(--ink); } .boot-stages .active .st-icon { border-color: var(--pink); border-top-color: transparent; animation: spin .8s linear infinite; }
    .boot-stages .done { color: var(--ink-2); } .boot-stages .done .st-icon { background: var(--good); border-color: var(--good); }
    .boot-stages .fail { color: var(--bad); } .boot-stages .fail .st-icon { background: var(--bad); border-color: var(--bad); }
    .st-name { grid-column: 2; grid-row: 1; } .st-time { grid-column: 3; grid-row: 1; font: 11px var(--mono); color: var(--ink-3); }
    .st-detail { grid-column: 2 / 4; grid-row: 2; font: 11px var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .boot-term { min-height: 0; overflow-y: auto; font: 12px/1.45 var(--mono); color: var(--ink-2); background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; scrollbar-width: thin; user-select: text; -webkit-user-select: text; }
    .bl { white-space: pre-wrap; overflow-wrap: anywhere; }
    .bl .ts { color: #5f5676; margin-right: 10px; user-select: none; }
    .bl.w { color: var(--warn); } .bl.e { color: var(--bad); } .bl.dim { opacity: .45; }
    .bl.t-launch { color: #ff9ccb; } .bl.t-network { color: #8fb8f0; } .bl.t-db { color: #8fd8b5; } .bl.t-realm { color: #6f8f80; } .bl.t-perf { color: #6f6585; } .bl.t-diag { color: #d6b56b; }
    .boot-foot { display: flex; justify-content: space-between; align-items: center; padding: 0 24px 16px; font: 12px var(--mono); color: var(--ink-3); gap: 12px; }
    #xc-boot.failed #boot-hint { color: var(--bad); }
    @media (max-width: 760px) {
      .boot-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; padding: 12px 16px; gap: 12px; }
      .boot-stages { padding: 0; } .boot-stages li { padding: 3px 0; } .st-detail { display: none; }
      .boot-head, .boot-foot { padding-left: 16px; padding-right: 16px; } .boot-bar { margin: 0 16px; }
    }

    /* start gate: everything is loaded, one click opens the intro */
    #xc-boot.gated { cursor: pointer; }
    #xc-boot.gated .boot-body, #xc-boot.gated .boot-foot { opacity: .28; filter: blur(1.5px); transition: opacity .5s, filter .5s; }
    .gate { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; padding: 16px; pointer-events: none; animation: gate-in .5s ease-out; }
    .gate-ring { width: 88px; height: 88px; border-radius: 50%; border: 3px solid transparent; margin-bottom: 14px;
      border-color: var(--pink); animation: gate-pulse 1.6s ease-in-out infinite; }
    .gate-title { font-size: clamp(22px, 3.4vw, 34px); font-weight: 800; letter-spacing: -.02em; }
    .gate-sub { font: 12px var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; }
    #xc-boot.opening .gate { opacity: 0; transform: scale(1.06); transition: opacity .35s, transform .35s; }
    @keyframes gate-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @keyframes gate-in { from { opacity: 0; transform: translateY(8px); } }

    /* ------------------------------------------------------------ log viewer */
    #xc-logview { position: fixed; left: 50%; top: 6vh; transform: translateX(-50%); width: min(1100px, calc(100vw - 32px)); height: 70vh; z-index: 8; display: none; flex-direction: column;
      background: rgba(10,10,18,.94); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 30px 80px rgba(0,0,0,.6); padding: 12px; gap: 8px; backdrop-filter: blur(8px); }
    #xc-logview.show { display: flex; }
    #xc-logview .boot-term { flex: 1; }
    .lv-head { display: flex; gap: 8px; align-items: center; } .lv-head strong { margin-right: auto; }
    .lv-head input { background: rgba(0,0,0,.4); border: 1px solid var(--line-2); border-radius: 8px; padding: 5px 8px; width: min(280px, 40vw); }
    .lv-foot { font: 11px var(--mono); color: var(--ink-3); }

    /* ------------------------------------------------------------ perf overlay */
