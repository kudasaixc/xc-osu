<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>xc-osu!</title>
  <meta name="description" content="xc-osu!: the full osu!lazer client running natively in your browser. Web port by xc softworks (kudasaixc).">
  <meta name="author" content="xc softworks (kudasaixc)">
  <link rel="preload" id="webassembly" />
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0b0b12">
  <script type="importmap"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b12; --panel: rgba(255,255,255,.035); --panel-2: rgba(255,255,255,.06); --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.14);
      --ink: #f2eaff; --ink-2: #c2b6d8; --ink-3: #8a7fa3; --pink: #ff66aa; --violet: #b46cff;
      --good: #4cc38a; --warn: #e8b04a; --bad: #ff6b6b;
      --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, Menlo, monospace;
      --sans: system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); overflow: hidden; overscroll-behavior: none; }
    #xc-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; touch-action: none; }
    button, input, select { font: inherit; color: inherit; }
    a { color: var(--pink); }
    .muted { color: var(--ink-3); } .small { font-size: 12px; }
    .xc-mark { font-weight: 800; letter-spacing: -.03em; color: var(--pink); }
    .ghost { background: transparent; border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 12px; cursor: pointer; color: var(--ink-2); }
    .ghost:hover { border-color: var(--pink); color: var(--ink); }
    .primary-sm { background: var(--pink); border: 0; border-radius: 8px; padding: 6px 14px; cursor: pointer; color: #fff; font-weight: 600; margin-right: 8px; }
    :focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }

    /* ------------------------------------------------------------ launcher */
    @font-face { font-family: 'Chakra Petch'; font-weight: 600; font-style: normal; font-display: swap; src: url(fonts/ChakraPetch-600.woff2) format('woff2'); }
    @font-face { font-family: 'Chakra Petch'; font-weight: 700; font-style: normal; font-display: swap; src: url(fonts/ChakraPetch-700.woff2) format('woff2'); }
    @font-face { font-family: 'IBM Plex Sans'; font-weight: 400 600; font-style: normal; font-display: swap; src: url(fonts/IBMPlexSans.woff2) format('woff2'); }
    #xc-launcher {
      --h: 333;
      --l-bg: hsl(var(--h) 14% 8%); --l-top: hsl(var(--h) 14% 6% / .92); --l-panel: hsl(var(--h) 12% 13% / .94); --l-panel-2: hsl(var(--h) 11% 18%);
      --l-edge: hsl(var(--h) 10% 20%); --l-edge-2: hsl(var(--h) 10% 28%); --l-rail: hsl(var(--h) 14% 6%);
      --l-ink: hsl(var(--h) 30% 95%); --l-ink-2: hsl(var(--h) 12% 82%); --l-ink-3: hsl(var(--h) 8% 66%);
      --l-accent: #ff66aa; --l-accent-hi: #ff85bc; --l-accent-ink: #2a0716;
      --l-good: #66cc88; --l-warn: #ffcc22; --l-bad: #ff6666;
      --l-head: 'Chakra Petch', var(--sans); --l-body: 'IBM Plex Sans', var(--sans);
      --gut: clamp(16px, 4vw, 56px);
      position: fixed; inset: 0; z-index: 5; display: none; grid-template-rows: auto 1fr auto;
      background: var(--l-bg); color: var(--l-ink); font: 16px/1.6 var(--l-body); transition: opacity .4s; }
    #xc-launcher.show { display: grid; }
    #xc-launcher [hidden] { display: none !important; }
    #xc-launcher.gone { opacity: 0; pointer-events: none; }
    #xc-launcher h1, #xc-launcher h2, #xc-launcher h3, #xc-launcher .play, #xc-launcher .ln-logo, #xc-launcher .ln-tab { font-family: var(--l-head); }
    #xc-launcher .muted { color: var(--l-ink-3); }
    #xc-launcher .small { font-size: 14px; }
    #xc-launcher a { color: var(--l-accent); text-decoration: none; } #xc-launcher a:hover { text-decoration: underline; }
    #xc-launcher :focus-visible { outline: 2px solid var(--l-accent); outline-offset: 3px; }

    /* background: one of the game's seasonal menu backgrounds, clear on Play, dimmed elsewhere */
    .ln-art { position: absolute; inset: 0; background: center / cover no-repeat; opacity: 0; transition: opacity 1.2s; }
    .ln-art.on { opacity: 1; }
    .ln-art::after { content: ''; position: absolute; inset: 0; transition: background .5s;
      background: linear-gradient(90deg, hsl(var(--h) 14% 7% / .9) 0, hsl(var(--h) 14% 7% / .55) 55%, hsl(var(--h) 14% 7% / .35)), linear-gradient(0deg, hsl(var(--h) 14% 7%) 0, transparent 45%); }
    #xc-launcher:not([data-tab=play]) .ln-art::after { background: hsl(var(--h) 14% 7% / .93); }
    .ln-bg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

    /* top bar: logo + word tabs, like the site */
    .ln-top { position: relative; z-index: 3; display: flex; align-items: center; gap: clamp(12px, 3vw, 36px); padding: 0 var(--gut); height: 64px; background: var(--l-top); border-bottom: 1px solid var(--l-edge); }
    .ln-brand { display: flex; align-items: center; gap: 10px; flex: none; color: var(--l-ink); }
    .ln-logo { will-change: transform; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--l-accent); color: var(--l-accent-ink); font-weight: 700; font-size: 16px; letter-spacing: -.02em; box-shadow: inset 0 0 0 3px hsl(var(--h) 100% 85% / .55); }
    .ln-brand b { font: 700 18px/1 var(--l-head); letter-spacing: -.01em; }
    .ln-tabs { display: flex; height: 100%; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .ln-tab { position: relative; flex: none; border: 0; background: none; padding: 0 14px; height: 100%; cursor: pointer; color: var(--l-ink-2); font-size: 17px; font-weight: 600; transition: color .15s; }
    .ln-tab::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--l-accent); transform: scaleX(0); transition: transform .2s cubic-bezier(.2,.8,.2,1); }
    .ln-tab:hover { color: var(--l-ink); }
    .ln-tab.on { color: var(--l-ink); } .ln-tab.on::after { transform: scaleX(1); }
    #xc-launcher .ln-site { margin-left: auto; flex: none; display: flex; align-items: center; gap: 6px; color: var(--l-ink-2); font-size: 15px; }
    #xc-launcher .ln-site:hover { color: var(--l-ink); text-decoration: none; }
    .ln-site svg { width: 18px; height: 18px; }

    .stage { position: relative; z-index: 2; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--l-edge-2) transparent; }
    .pane { padding: clamp(28px, 5vh, 56px) var(--gut) 56px; max-width: 1560px; }
    .pane-head .title { font-size: clamp(32px, 3.2vw, 46px); }
    .pane-head { margin-bottom: 28px; max-width: 720px; }
    .title { margin: 0; font-size: clamp(28px, 3vw, 40px); line-height: 1.1; font-weight: 700; letter-spacing: -.01em; }
    .lede { margin: 14px 0 0; color: var(--l-ink-2); font-size: 19px; line-height: 1.55; max-width: 46ch; text-wrap: pretty; }

    /* Play: the art and the little playfield are the screen; text sits low-left */
    #pane-play { min-height: 100%; display: flex; flex-direction: column; max-width: none; padding-top: 0; padding-bottom: 32px; }
    #pane-play .hero { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(380px, 460px); column-gap: clamp(32px, 5vw, 96px); align-items: end; min-height: 340px; padding: 48px 0 36px; }
    #pane-play .pane-head { display: flex; flex-direction: column; justify-content: flex-end; max-width: none; margin: 0; padding: 0; }
    .launch-slot:empty { display: none; }
    @media (max-width: 1023px) { #pane-play .hero { grid-template-columns: minmax(0, 1fr); } }
    #pane-play .pane-head > * { max-width: 640px; }
    .kicker { margin: 0 0 10px; color: var(--l-accent); font: 600 15px/1 var(--l-head); }
    #pane-play .title { font-size: clamp(44px, 6.4vw, 96px); line-height: .92; letter-spacing: -.03em; text-wrap: balance; text-shadow: 0 2px 24px hsl(var(--h) 30% 4% / .6); }
    #pane-play .pane-head > .title { max-width: 11ch; }
    .ver { margin: 0 0 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; color: var(--l-ink-2); font: 600 16px/1.2 var(--l-head); }
    .ver small { font: 600 14px/1 var(--l-head); padding: 5px 10px; border-radius: 999px; background: hsl(var(--h) 12% 18% / .8); color: var(--l-ink-2); }
    .ver small:empty { display: none; }
    .title small { display: none; white-space: nowrap; font-size: max(.28em, 15px); font-weight: 600; color: var(--l-ink-2); margin-left: 14px; letter-spacing: 0; vertical-align: .35em; padding: 3px 10px; border-radius: 999px; background: hsl(var(--h) 12% 18% / .8); }
    .title small:empty { display: none; }
    .hello { margin: 20px 0 0; color: var(--l-ink); font-size: 16px; padding-left: 12px; border-left: 3px solid var(--l-accent); }

    .ln-strip { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 0; background: var(--l-panel); border-radius: 10px; }
    .ln-strip > section { padding: 20px 24px; min-width: 0; }
    .ln-strip > section + section { border-left: 1px solid var(--l-edge); }
    .ln-strip h2, .sect h2 { margin: 0 0 14px; font-size: 19px; font-weight: 600; color: var(--l-ink); }
    .ln-strip h2 .muted, .sect h2 .muted { font: 400 15px var(--l-body); margin-left: 6px; }
    .ln-specs { grid-column: 1 / -1; border-top: 1px solid var(--l-edge); padding: 0 24px; }
    .ln-specs summary { cursor: pointer; padding: 14px 0; color: var(--l-ink-2); font-size: 15px; list-style: none; display: flex; align-items: center; gap: 8px; }
    .ln-specs summary::-webkit-details-marker { display: none; }
    .ln-specs summary::before, .adv > summary::before { content: ''; width: 7px; height: 7px; border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(-45deg); transition: transform .2s; margin-right: 4px; }
    .ln-specs[open] summary::before, .adv[open] > summary::before { transform: rotate(45deg); }
    .ln-specs summary:hover { color: var(--l-ink); }
    .ln-specs .spec { padding-bottom: 18px; columns: 2 320px; column-gap: 40px; display: block; }
    .link { background: none; border: 0; padding: 0; margin-top: 14px; color: var(--l-accent); cursor: pointer; font-size: 15px; font-weight: 600; }
    .link:hover { text-decoration: underline; }

    .spec { margin: 0; display: grid; }
    .spec div { display: grid; grid-template-columns: 150px 1fr; gap: 12px; padding: 7px 0; border-top: 1px solid var(--l-edge); break-inside: avoid; }
    .spec dt { color: var(--l-ink-3); }
    .spec dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

    /* News: a single readable column */
    .news-divider { border: 0; border-top: 1px solid var(--l-edge); margin: 16px 0; }
    .post { overflow-wrap: anywhere; }
    .posts { display: grid; max-width: 1080px; }
    .posts > .panel { padding: 30px 0; border-top: 1px solid var(--l-edge); }
    .posts .post { display: grid; grid-template-columns: 170px minmax(0, 1fr); column-gap: 32px; }
    .posts .post > * { grid-column: 2; } .posts .post > .post-meta { grid-column: 1; grid-row: 1 / span 4; flex-direction: column; align-items: flex-start; gap: 8px; padding-top: 6px; }
    .posts > .panel:first-child h3 { font-size: clamp(28px, 2.6vw, 36px); }
    .posts p { font-size: 17px; }
    .posts > .panel:first-child { border-top: 0; padding-top: 0; }
    .post-meta { display: flex; gap: 10px; align-items: center; font-size: 15px; color: var(--l-ink-3); }
    .tag { font-size: 13.5px; padding: 2px 10px; border-radius: 999px; background: hsl(var(--h) 60% 60% / .14); color: var(--l-accent-hi); }
    .post h3 { margin: 6px 0 10px; font-size: 25px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
    .post p { margin: 0; color: var(--l-ink-2); max-width: 64ch; line-height: 1.65; }
    .post ul { margin: 6px 0 0; padding-left: 20px; color: var(--l-ink-2); max-width: 70ch; }
    .more summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--l-accent); font-weight: 600; font-size: 15px; }
    .more summary::-webkit-details-marker { display: none; }
    .more summary::before { content: ''; width: 7px; height: 7px; border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(-45deg); transition: transform .2s; margin-right: 2px; }
    .more[open] summary::before { transform: rotate(45deg); }
    .more summary:hover { color: var(--l-accent-hi); }
    .post li { margin: 5px 0; }
    #ln-latest .post h3 { font-size: 20px; margin: 4px 0 6px; }
    #ln-latest .more { display: none; }
    #ln-latest .post p { font-size: 15.5px; -webkit-line-clamp: 2; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
    #ln-latest .post ul { display: none; }

    /* Status */
    .st-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 0; margin-bottom: 32px; background: var(--l-panel); border-radius: 10px; }
    .st-top > section { padding: 24px; min-width: 0; } .st-top > section + section { border-left: 1px solid var(--l-edge); }
    .sect { margin-bottom: 36px; }
    .sect > h2 { font-size: 20px; margin-bottom: 14px; }
    .sect-2 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 48px; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--l-ink-3); }
    .st-done .dot { background: var(--l-good); } .st-partial .dot, .sev-medium .dot { background: var(--l-warn); } .sev-high .dot { background: var(--l-bad); }
    .sev-low .dot { background: var(--l-ink-3); }
    .sev { font-size: 14px; font-weight: 600; padding: 1px 9px; border-radius: 999px; background: hsl(var(--h) 10% 22%); color: var(--l-ink-2); white-space: nowrap; }
    .sev-high .sev { color: #ff8a8a; background: hsl(0 80% 60% / .14); } .sev-medium .sev { color: var(--l-warn); background: hsl(45 100% 57% / .12); }
    .st-done .ps { color: var(--l-good) !important; } .st-partial .ps { color: var(--l-warn) !important; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: -4px 0 14px; color: var(--l-ink-2); font-size: 15px; } .legend > span { display: inline-flex; align-items: center; gap: 8px; }
    .meter-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .meter-top b { font-family: var(--l-head); font-size: 72px; line-height: 1; font-weight: 700; letter-spacing: -.02em; }
    .meter-bar { height: 8px; border-radius: 8px; background: var(--l-edge); overflow: hidden; margin: 14px 0 10px; }
    .meter-bar i { display: block; height: 100%; border-radius: 8px; background: var(--l-accent); }
    .meter p { margin: 0; }
    table { width: 100%; border-collapse: collapse; }
    .port td { padding: 9px 0; border-top: 1px solid var(--l-edge); vertical-align: top; }
    .port td:first-child { width: 22px; padding-top: 16px; }
    @media (min-width: 1100px) { .port tbody { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 48px; } .port tr { display: grid; grid-template-columns: 22px 1fr auto; } }
    .port .ps { text-align: right; color: var(--l-ink-3); font-size: 14.5px; white-space: nowrap; padding-left: 12px; }
    .port .st-todo td:nth-child(2) { color: var(--l-ink-3); }
    .issues { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
    .issues li { display: grid; grid-template-columns: 12px 1fr; gap: 12px; }
    .issues .dot { margin-top: 9px; }
    .iss-title { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .iss-title strong { font-weight: 600; }
        .issues p { margin: 4px 0 0; color: var(--l-ink-2); font-size: 15.5px; max-width: 72ch; }
    .issue-mini { list-style: none; padding: 0; margin: 0; display: grid; gap: 9px; }
    .issue-mini li { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; font-size: 15.5px; }
    .kept { display: flex; align-items: baseline; gap: 12px; margin: 8px 0 14px; flex-wrap: wrap; }
    .kept b { font-family: var(--l-head); font-size: 32px; font-weight: 700; } .kept span { color: var(--l-ink-2); font-size: 14px; }
    .trees { font-size: 15px; margin-bottom: 10px; }
    .trees th { text-align: left; font-weight: 500; color: var(--l-ink-3); padding: 0 0 6px; }
    .trees td { padding: 7px 0; border-top: 1px solid var(--l-edge); }
    .trees td:nth-child(2) { width: 42%; padding-right: 12px; }
    .trees .num { text-align: right; }
    .tbar { display: inline-block; vertical-align: middle; width: calc(100% - 64px); height: 6px; border-radius: 6px; background: var(--l-edge); overflow: hidden; }
    .tbar i { display: block; height: 100%; background: var(--l-accent); border-radius: 6px; }
    .tv { display: inline-block; width: 60px; text-align: right; font-variant-numeric: tabular-nums; }
    .sys { margin: 0; display: grid; font-size: 15px; }
    .sys div { display: grid; grid-template-columns: 170px 1fr; gap: 12px; padding: 7px 0; border-top: 1px solid var(--l-edge); }
    .sys dt { color: var(--l-ink-3); } .sys dd { margin: 0; overflow-wrap: anywhere; }
    #ln-performance { overflow: auto; }
    #xc-launcher .perf-card { background: var(--l-panel); border-color: var(--l-edge); border-radius: 10px; }
    #xc-launcher .perf-filter select { background: var(--l-rail); border-color: var(--l-edge-2); }

    /* Options: presets first, then the few settings people change, the rest folded away */
    .presets { margin-bottom: 32px; }
    .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
    .chip { border: 1px solid var(--l-edge-2); background: var(--l-panel); border-radius: 10px; padding: 16px 18px; cursor: pointer; color: var(--l-ink-2); font: 600 16px/1.2 var(--l-head); text-align: left; transition: border-color .15s, color .15s, background .15s, transform .12s; }
    .chip:hover { color: var(--l-ink); border-color: var(--l-ink-3); }
    .chip:active { transform: scale(.98); }
    .chip.on { background: var(--l-accent); border-color: var(--l-accent); color: var(--l-accent-ink); }
    .chip.static { cursor: default; }
    .opt-grid { display: grid; gap: 8px; }
    .ess { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 40px; background: var(--l-panel); border-radius: 10px; padding: 8px 24px; margin-bottom: 24px; }
    .ess .opt { border-top: 1px solid var(--l-edge); } .ess .opt:nth-child(-n+3) { border-top: 0; }
    .adv { border-top: 1px solid var(--l-edge); }
    .adv > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; padding: 16px 0; font: 600 17px var(--l-head); color: var(--l-ink); }
    .adv > summary::-webkit-details-marker { display: none; }
    .adv > summary .muted { font: 400 14px var(--l-body); }
    .adv > summary:hover { color: var(--l-accent-hi); }
    .adv-body { columns: 3 340px; column-gap: 40px; padding-bottom: 12px; }
    .opt-sec { break-inside: avoid; margin-bottom: 20px; }
    .opt-sec h2 { margin: 0 0 2px; font-size: 16px; font-weight: 600; color: var(--l-accent-hi); }
    .opt { padding: 12px 0; position: relative; }
    .opt-sec .opt + .opt { border-top: 1px solid var(--l-edge); }
    .opt.mod > label > span::after { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--l-accent); margin-left: 8px; vertical-align: middle; }
    .opt label { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .opt output { color: var(--l-ink-2); font-variant-numeric: tabular-nums; }
    .opt .help { margin: 4px 0 0; font-size: 14.5px; color: var(--l-ink-3); line-height: 1.5; }
    .opt select, .opt input[type=url] { width: 100%; margin-top: 8px; background: var(--l-rail); border: 1px solid var(--l-edge-2); border-radius: 8px; padding: 9px 10px; }
    .opt select:hover, .opt input[type=url]:hover { border-color: var(--l-ink-3); }
    .opt input[type=range] { width: 100%; margin: 10px 0 0; accent-color: var(--l-accent); }
    .tog label { cursor: pointer; }
    .tog input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .sw { flex: none; width: 40px; height: 22px; border-radius: 999px; background: var(--l-edge-2); position: relative; transition: background .2s; }
    .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s cubic-bezier(.2,.8,.2,1); }
    .tog input:checked + .sw { background: var(--l-accent); } .tog input:checked + .sw::after { transform: translateX(18px); }
    .tog input:focus-visible + .sw { outline: 2px solid var(--l-accent); outline-offset: 2px; }
    #ln-local-telemetry { margin-top: 10px; }
    .data-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; padding: 4px 0 8px; }
    .data-row label { flex: 1 1 260px; display: grid; gap: 6px; font-size: 15px; color: var(--l-ink-2); }
    .data-row input { background: var(--l-rail); border: 1px solid var(--l-edge-2); border-radius: 8px; padding: 9px 10px; }
    .backup-status { margin: 8px 0; padding: 10px 14px; border-left: 3px solid var(--l-accent); background: var(--l-panel-2); color: var(--l-ink); font-size: 14px; font-variant-numeric: tabular-nums; }
    .backup-status.err { border-color: var(--l-bad); color: #ff9494; }
    .cmd { margin-top: 8px; }
    .cmd h2 { font-size: 14px; margin: 0 0 8px; color: var(--l-ink-2); font-weight: 600; }
    .cmd code { display: block; font: 12.5px/1.6 var(--mono); color: var(--l-ink-2); background: var(--l-rail); border-radius: 8px; padding: 12px 14px; overflow-wrap: anywhere; }
    .btn { border: 1px solid var(--l-edge-2); background: var(--l-panel-2); color: var(--l-ink); border-radius: 8px; padding: 9px 16px; cursor: pointer; transition: border-color .15s, background .15s; }
    .btn:hover { border-color: var(--l-ink-3); }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn.danger { color: #ff9494; border-color: hsl(0 70% 60% / .45); }
    .btn.danger:hover { background: hsl(0 80% 60% / .14); }

    /* dock: download state + the Launch button, which is also the progress bar */
    .dock { position: relative; z-index: 3; display: flex; align-items: center; gap: 24px; padding: 14px var(--gut); padding-bottom: calc(14px + env(safe-area-inset-bottom)); background: var(--l-top); border-top: 1px solid var(--l-edge); }
    .dock-dl { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 16px; color: var(--l-ink-2); font-size: 15px; font-variant-numeric: tabular-nums; }
    .dock-dl strong { color: var(--l-ink); font-weight: 600; font-size: 17px; width: 100%; }
    .dock-dl .bad, .dock-dl.err strong { color: var(--l-bad); }
    .dl-pct, .dl-track { display: none; }
    /* the same dock, hosted beside the Play title on wide screens */
    .dock.in-hero { flex-direction: column; align-items: stretch; gap: 22px; padding: 26px 28px 22px; background: hsl(var(--h) 14% 8% / .9); border: 1px solid var(--l-edge); border-radius: 14px; box-shadow: 0 18px 50px hsl(var(--h) 30% 3% / .45); }
    .in-hero .dock-dl { flex: none; align-items: center; gap: 4px 16px; }
    .in-hero .dock-dl strong { order: 1; width: auto; flex: 1; font-size: 18px; }
    .in-hero .dl-pct { order: 2; display: block; font: 700 26px/1 var(--l-head); color: var(--l-ink); }
    .in-hero .dl-track { order: 3; display: block; width: 100%; height: 10px; margin: 10px 0 6px; border-radius: 999px; background: hsl(var(--h) 12% 20%); overflow: hidden; }
    .in-hero .dl-track { position: relative; box-shadow: inset 0 1px 2px hsl(var(--h) 30% 3% / .5); }
    .in-hero .dl-track i { position: relative; display: block; height: 100%; width: 0; min-width: 10px; border-radius: inherit; overflow: hidden;
      background: linear-gradient(90deg, #ff4f9a, #ff66aa 45%, #c25cff); box-shadow: 0 0 14px #ff66aa88; transition: width .45s cubic-bezier(.2,.8,.2,1), box-shadow .4s; }
    .in-hero .dl-track i::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, #fff3 0 10px, #fff0 10px 22px); background-size: 48px 100%; animation: xc-stripes .9s linear infinite; }
    .in-hero .dl-track i::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 40%; background: linear-gradient(90deg, #fff0, #fff8, #fff0); animation: xc-shimmer 1.6s ease-in-out infinite; }
    #xc-launcher.dl-done .in-hero .dl-track i { background: linear-gradient(90deg, #4fbf7a, var(--l-good), #8fe0a8); box-shadow: 0 0 16px #66cc8899; animation: xc-done-glow 1.2s ease-out; }
    #xc-launcher.dl-done .in-hero .dl-track i::before, #xc-launcher.dl-done .in-hero .dl-track i::after { animation: none; opacity: 0; }
    .in-hero .dl-pct { font-variant-numeric: tabular-nums; }
    .in-hero .dock-dl > span:not(.dl-pct):not(.dl-track) { order: 4; }
    .in-hero .dock-right { flex-direction: column-reverse; align-items: stretch; gap: 14px; }
    .in-hero .play { width: 100%; min-width: 0; height: 84px; font-size: 32px; }
    .in-hero .play > i { display: none; }
    .in-hero .dock-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; }
    .dock-right { display: flex; align-items: center; gap: 22px; }
    .dock-meta { display: grid; justify-items: end; font-size: 14.5px; color: var(--l-ink-2); line-height: 1.45; }
    .play { position: relative; overflow: hidden; isolation: isolate; min-width: 300px; height: 68px; padding: 0 44px; border: 0; border-radius: 999px; cursor: pointer;
      font-size: 26px; font-weight: 700; letter-spacing: .01em; background: hsl(var(--h) 40% 22%); color: var(--l-ink);
      box-shadow: inset 0 1px 0 #ffffff14, 0 6px 18px hsl(var(--h) 30% 3% / .35);
      transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .3s, color .2s, letter-spacing .3s; }
    .play > span { position: relative; z-index: 2; }
    .play > i { position: absolute; inset: 0 auto 0 0; width: 0; z-index: -1; background: linear-gradient(90deg, #ff4f9a99, #c25cff99); transition: width .45s cubic-bezier(.2,.8,.2,1); }
    /* glossy sweep, crosses the button on hover */
    .play::before { content: ''; position: absolute; z-index: 1; top: 0; bottom: 0; left: -45%; width: 35%; transform: skewX(-20deg); pointer-events: none;
      background: linear-gradient(90deg, #fff0, #ffffff73, #fff0); transition: left .7s cubic-bezier(.2,.8,.2,1); }
    .play:hover::before { left: 120%; }
    /* soft top highlight */
    .play::after { content: ''; position: absolute; z-index: 1; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(180deg, #ffffff2e, #fff0 55%); }
    #xc-launcher.dl-done .play { color: #fff; text-shadow: 0 1px 2px #5a0a3266;
      background: linear-gradient(110deg, #ff4f9a 0%, #ff66aa 22%, #d65cff 50%, #8c6bff 66%, #ff66aa 84%, #ff4f9a 100%); background-size: 300% 100%;
      box-shadow: inset 0 1px 0 #ffffff40, 0 10px 30px #ff66aa55, 0 2px 8px #c25cff40;
      animation: xc-grad 7s ease-in-out infinite alternate, xc-ready .7s cubic-bezier(.2,.8,.2,1); }
    #xc-launcher.dl-done .play > i { opacity: 0; }
    .play:hover { transform: translateY(-2px) scale(1.02); box-shadow: inset 0 1px 0 #ffffff1f, 0 12px 28px hsl(var(--h) 30% 3% / .5); }
    #xc-launcher.dl-done .play:hover { transform: translateY(-3px) scale(1.035); letter-spacing: .04em;
      box-shadow: inset 0 1px 0 #ffffff55, 0 18px 44px #ff66aa80, 0 4px 14px #c25cff66, 0 0 0 4px #ff66aa26; }
    .play:active, #xc-launcher.dl-done .play:active { transform: translateY(0) scale(.97); transition-duration: .08s; }
    .play:focus-visible { outline: 3px solid #ffffffcc; outline-offset: 3px; }
    .play:disabled, #xc-launcher.dl-done .play:disabled { background: var(--l-edge-2); color: var(--l-ink-3); text-shadow: none; box-shadow: none; cursor: not-allowed; transform: none; animation: none; letter-spacing: .01em; }
    .play:disabled::before, .play:disabled::after { display: none; }
    @keyframes xc-grad { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
    @keyframes xc-ready { 0% { transform: scale(.96); filter: brightness(1.4); } 60% { transform: scale(1.03); } 100% { transform: none; filter: none; } }
    @keyframes xc-stripes { to { background-position: 48px 0; } }
    @keyframes xc-shimmer { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @keyframes xc-done-glow { 0% { box-shadow: 0 0 0 #66cc8800; filter: brightness(1.6); } 40% { box-shadow: 0 0 26px #66cc88cc; } 100% { box-shadow: 0 0 16px #66cc8899; filter: none; } }

    @media (max-width: 980px) { .ln-strip, .st-top, .sect-2 { grid-template-columns: 1fr; gap: 0; } .ln-strip > section + section, .st-top > section + section { border-left: 0; border-top: 1px solid var(--l-edge); } .sect-2 > * + * { margin-top: 36px; } .ess { grid-template-columns: 1fr; } .ess .opt:nth-child(n+2) { border-top: 1px solid var(--l-edge); } .posts .post { grid-template-columns: 1fr; } .posts .post > .post-meta { grid-column: 1; grid-row: auto; flex-direction: row; padding: 0; } .posts .post > * { grid-column: 1; } }
    @media (min-width: 981px) and (max-width: 1280px) { .ess { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ess .opt:nth-child(3) { border-top: 1px solid var(--l-edge); } }
    @media (max-width: 640px) {
      #xc-launcher { font-size: 15px; }
      .ln-top { height: auto; flex-wrap: wrap; gap: 0 12px; padding-top: 10px; }
      .ln-brand b { display: none; }
      .ln-tabs { order: 3; width: 100%; height: 46px; margin: 0 -8px; }
      .ln-tab { padding: 0 10px; font-size: 15px; } .ln-tab::after { left: 10px; right: 10px; }
      .ln-site span { display: none; }
      #pane-play .hero { min-height: 260px; padding: 32px 0 24px; }
      #pane-play .title { font-size: clamp(40px, 13vw, 56px); }
            .ln-strip > section, .st-top > section { padding: 18px 16px; } .ln-specs { padding: 0 16px; }
      .spec div, .sys div { grid-template-columns: 1fr; gap: 0; }
      .ess { padding: 4px 16px; }
      .dock { flex-direction: column; align-items: stretch; gap: 10px; padding-top: 12px; }
      .dock-dl strong { width: auto; }
      .dock-right { justify-content: space-between; gap: 12px; } .play { min-width: 0; flex: 1; height: 58px; font-size: 22px; }
      .dock-meta { justify-items: start; min-width: 0; flex: 0 1 auto; } .dock-meta > * { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .play { flex: 0 0 auto; min-width: 0; padding: 0 20px; white-space: nowrap; font-size: 18px; height: 54px; }
      .dock-meta { flex: 1 1 0; }
      .chips { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* ------------------------------------------------------------ verbose launch */
    #xc-boot { position: fixed; inset: 0; z-index: 6; display: none; flex-direction: column; background: rgba(8,8,14,.97); transition: opacity .6s; }
    #xc-boot.show { display: flex; } #xc-boot.gone { opacity: 0; pointer-events: none; }
    .boot-head { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 24px 10px; }
    .boot-title { display: flex; align-items: baseline; gap: 12px; } .boot-title .xc-mark { font-size: 22px; }
    .boot-sub { font: 12px var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; }
    .boot-clock { font: 13px var(--mono); color: var(--ink-2); }
    .boot-bar { height: 2px; background: var(--line); margin: 0 24px; }
    .boot-bar i { display: block; height: 100%; width: 0; background: var(--pink); transition: width .4s; }
    #xc-boot.failed .boot-bar i { background: var(--bad); }
    .boot-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 320px 1fr; gap: 0; padding: 16px 24px; }
    .boot-stages { list-style: none; margin: 0; padding: 0 20px 0 0; font-size: 13px; }
    .boot-stages li { display: grid; grid-template-columns: 18px 1fr auto; grid-template-rows: auto auto; column-gap: 8px; padding: 7px 0; color: var(--ink-3); }
    .st-icon { grid-row: 1 / 3; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink-3); margin-top: 5px; }
    .boot-stages .active { color: var(--ink); } .boot-stages .active .st-icon { border-color: var(--pink); border-top-color: transparent; animation: spin .8s linear infinite; }
    .boot-stages .done { color: var(--ink-2); } .boot-stages .done .st-icon { background: var(--good); border-color: var(--good); }
    .boot-stages .fail { color: var(--bad); } .boot-stages .fail .st-icon { background: var(--bad); border-color: var(--bad); }
    .st-name { grid-column: 2; grid-row: 1; } .st-time { grid-column: 3; grid-row: 1; font: 11px var(--mono); color: var(--ink-3); }
    .st-detail { grid-column: 2 / 4; grid-row: 2; font: 11px var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .boot-term { min-height: 0; overflow-y: auto; font: 12px/1.45 var(--mono); color: var(--ink-2); background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; scrollbar-width: thin; user-select: text; -webkit-user-select: text; }
    .bl { white-space: pre-wrap; overflow-wrap: anywhere; }
    .bl .ts { color: #5f5676; margin-right: 10px; user-select: none; }
    .bl.w { color: var(--warn); } .bl.e { color: var(--bad); } .bl.dim { opacity: .45; }
    .bl.t-launch { color: #ff9ccb; } .bl.t-network { color: #8fb8f0; } .bl.t-db { color: #8fd8b5; } .bl.t-realm { color: #6f8f80; } .bl.t-perf { color: #6f6585; } .bl.t-diag { color: #d6b56b; }
    .boot-foot { display: flex; justify-content: space-between; align-items: center; padding: 0 24px 16px; font: 12px var(--mono); color: var(--ink-3); gap: 12px; }
    #xc-boot.failed #boot-hint { color: var(--bad); }
    @media (max-width: 760px) {
      .boot-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; padding: 12px 16px; gap: 12px; }
      .boot-stages { padding: 0; } .boot-stages li { padding: 3px 0; } .st-detail { display: none; }
      .boot-head, .boot-foot { padding-left: 16px; padding-right: 16px; } .boot-bar { margin: 0 16px; }
    }

    /* start gate: everything is loaded, one click opens the intro */
    #xc-boot.gated { cursor: pointer; }
    #xc-boot.gated .boot-body, #xc-boot.gated .boot-foot { opacity: .28; filter: blur(1.5px); transition: opacity .5s, filter .5s; }
    .gate { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; padding: 16px; pointer-events: none; animation: gate-in .5s ease-out; }
    .gate-ring { width: 88px; height: 88px; border-radius: 50%; border: 3px solid transparent; margin-bottom: 14px;
      border-color: var(--pink); animation: gate-pulse 1.6s ease-in-out infinite; }
    .gate-title { font-size: clamp(22px, 3.4vw, 34px); font-weight: 800; letter-spacing: -.02em; }
    .gate-sub { font: 12px var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; }
    #xc-boot.opening .gate { opacity: 0; transform: scale(1.06); transition: opacity .35s, transform .35s; }
    @keyframes gate-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @keyframes gate-in { from { opacity: 0; transform: translateY(8px); } }

    /* ------------------------------------------------------------ log viewer */
    #xc-logview { position: fixed; left: 50%; top: 6vh; transform: translateX(-50%); width: min(1100px, calc(100vw - 32px)); height: 70vh; z-index: 8; display: none; flex-direction: column;
      background: rgba(10,10,18,.94); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 30px 80px rgba(0,0,0,.6); padding: 12px; gap: 8px; backdrop-filter: blur(8px); }
    #xc-logview.show { display: flex; }
    #xc-logview .boot-term { flex: 1; }
    .lv-head { display: flex; gap: 8px; align-items: center; } .lv-head strong { margin-right: auto; }
    .lv-head input { background: rgba(0,0,0,.4); border: 1px solid var(--line-2); border-radius: 8px; padding: 5px 8px; width: min(280px, 40vw); }
    .lv-foot { font: 11px var(--mono); color: var(--ink-3); }

    /* ------------------------------------------------------------ perf overlay */
    #xc-perf { position: fixed; z-index: 7; width: 248px; display: none; pointer-events: none; background: rgba(16,16,24,.86); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px 10px; font: 11px/1.35 var(--sans); backdrop-filter: blur(6px); }
    #xc-perf.show { display: block; }
    #xc-perf.pos-tr { top: 12px; right: 12px; } #xc-perf.pos-tl { top: 12px; left: 12px; } #xc-perf.pos-br { bottom: 12px; right: 12px; } #xc-perf.pos-bl { bottom: 12px; left: 12px; }
    .pf-head { display: flex; justify-content: space-between; margin-bottom: 4px; } .pf-key { font-family: var(--mono); color: var(--ink-3); }
    .pf-chart { margin-top: 6px; }
    .pf-title { color: var(--ink-2); font-weight: 600; } .pf-unit { color: var(--ink-3); font-weight: 400; }
    .pf-legend { display: flex; flex-wrap: wrap; gap: 2px 10px; color: var(--ink-3); }
    .pf-legend i { display: inline-block; width: 8px; height: 2px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
    .pf-legend b { color: var(--ink); font-family: var(--mono); font-weight: 500; }
    .pf-chart canvas { display: block; width: 100%; height: 40px; margin-top: 2px; }
    .pf-stats { margin-top: 6px; white-space: pre-line; font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  .perf-filter { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:20px 0; } .perf-filter select { max-width:100%; padding:10px; background:var(--bg); color:inherit; border:1px solid var(--line); border-radius:8px; } .perf-results { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); gap:16px; margin-top:20px; } .perf-card { padding:20px; border:1px solid var(--line); border-radius:14px; background:var(--panel); min-width:0; } .perf-card header { display:flex; align-items:center; gap:10px; justify-content:space-between; } .perf-card h3 { margin:0; font-size:17px; } .perf-card p { line-height:1.6; overflow-wrap:anywhere; } .perf-metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:20px 0; } .perf-metrics dt { font-size:12px; color:var(--l-ink-2); } .perf-metrics dd { margin:7px 0 0; font-size:21px; font-weight:650; } .perf-metrics small { font-size:12px; } .perf-card summary { cursor:pointer; color:var(--l-ink-2); padding:8px 0; } .perf-caution { color:#efc580; font-size:12px; } @media(max-width:450px) { .perf-metrics { grid-template-columns:1fr; } .perf-metrics > div { display:flex; justify-content:space-between; align-items:center; } .perf-metrics dd { margin:0; } }
</style>
  <script type="module" src="main#[.{fingerprint}].js"></script>
</head>
<body>
  <canvas id="xc-canvas" tabindex="0"></canvas>
  <div id="xc-launcher"></div>
  <div id="xc-boot" role="status"></div>
  <div id="xc-perf" aria-hidden="true"></div>
  <div id="xc-logview" role="dialog" aria-label="Console"></div>
  <noscript><p style="padding:24px">xc-osu! needs JavaScript.</p></noscript>
</body>
</html>
