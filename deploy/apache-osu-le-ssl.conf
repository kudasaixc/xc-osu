# xc-osu! — xc softworks (kudasaixc)
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName osu.xcsoftworks.com
    DocumentRoot /var/www/osu/site
    DirectoryIndex index.html
    <Directory /var/www/osu/site>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    <FilesMatch "(?i)(?:^\.|\.(?:bak|old|orig|save|swp|tmp)$)">
        Require all denied
    </FilesMatch>

    # multithreaded WebAssembly (SharedArrayBuffer) needs cross-origin isolation
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Embedder-Policy "require-corp"
    Header always set Cross-Origin-Resource-Policy "same-origin"

    AddType application/wasm .wasm
    AddType application/octet-stream .dat .blat .pdb
    AddType text/javascript .js .mjs

    # pre-compressed publish output (.br / .gz next to each file)
    RewriteEngine on
    RewriteCond %{HTTP:Accept-Encoding} br
    RewriteCond %{REQUEST_FILENAME}.br -f
    RewriteRule ^(.*)$ $1.br [L]
    RewriteCond %{HTTP:Accept-Encoding} gzip
    RewriteCond %{REQUEST_FILENAME}.gz -f
    RewriteRule ^(.*)$ $1.gz [L]
    <FilesMatch "\.wasm\.br$">
        ForceType application/wasm
    </FilesMatch>
    <FilesMatch "\.wasm\.gz$">
        ForceType application/wasm
    </FilesMatch>
    <FilesMatch "\.js\.(br|gz)$">
        ForceType text/javascript
    </FilesMatch>
    <FilesMatch "\.json\.(br|gz)$">
        ForceType application/json
    </FilesMatch>
    <FilesMatch "\.(dll|dat|pdb|webcil|blat)\.(br|gz)$">
        ForceType application/octet-stream
    </FilesMatch>
    <FilesMatch "\.br$">
        Header set Content-Encoding br
        Header append Vary Accept-Encoding
        SetEnv no-gzip 1
    </FilesMatch>
    <FilesMatch "\.gz$">
        Header set Content-Encoding gzip
        Header append Vary Accept-Encoding
        SetEnv no-gzip 1
    </FilesMatch>

    <LocationMatch "^/_framework/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/dev/">
        Header set Cache-Control "no-cache"
    </LocationMatch>
    <LocationMatch "^/(index\.html|main\.js|js/)?$">
        Header set Cache-Control "no-cache"
    </LocationMatch>

    # xc-osu! server (same origin): API v2, OAuth, registration, chat websocket, SignalR hubs
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        /api/          http://127.0.0.1:5080/api/
    ProxyPassReverse /api/          http://127.0.0.1:5080/api/
    ProxyPass        /oauth/        http://127.0.0.1:5080/oauth/
    ProxyPassReverse /oauth/        http://127.0.0.1:5080/oauth/
    ProxyPass        /users         http://127.0.0.1:5080/users
    ProxyPass        /notifications http://127.0.0.1:5080/notifications upgrade=websocket
    ProxyPass        /signalr/      http://127.0.0.1:5080/signalr/ upgrade=websocket timeout=120
    ProxyPassReverse /signalr/      http://127.0.0.1:5080/signalr/

    ErrorLog ${APACHE_LOG_DIR}/osu-error.log
    CustomLog ${APACHE_LOG_DIR}/osu-access.log combined

SSLCertificateFile /etc/letsencrypt/live/osu.xcsoftworks.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/osu.xcsoftworks.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
