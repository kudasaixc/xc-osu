# xc-osu!: xc softworks (kudasaixc)
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName osu.xcsoftworks.com
    DocumentRoot /var/www/osu/site

    # The visitor's real address. Only Cloudflare can reach this server (ufw), and its CF-Connecting-IP is trusted from its
    # ranges only. Without this every per-address limit of the API saw a Cloudflare edge instead of the player.
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
    DirectoryIndex index.html
    <Directory /var/www/osu/site>
        Options -Indexes -MultiViews +SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted
    </Directory>
    <FilesMatch "(?i)(?:^\.|\.(?:bak|old|orig|save|swp|tmp|pdb)$)">
        Require all denied
    </FilesMatch>

    # Test builds (forks of the game) are not for the public: they talk to the live server and may log verbosely.
    <LocationMatch "^/(dev|aot|aot2|iostest|memtest)(/|$)">
        AuthType Basic
        AuthName "xc-osu! test builds"
        AuthBasicProvider file
        AuthUserFile /etc/apache2/xc-forks.htpasswd
        Require valid-user
        Header always set X-Robots-Tag "noindex, nofollow"
    </LocationMatch>

    # multithreaded WebAssembly (SharedArrayBuffer) needs cross-origin isolation
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), browsing-topics=()"
    # Enforced part: directives that cannot affect the game or the site (no plugins, no foreign
    # <base>, no foreign framing, no foreign form targets).
    Header always set Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'"
    # The game page carries the full policy itself (script-src with the hash of its build-generated import map, written by
    # tools/stamp.py at every deploy, in a <meta>). The /web site has no inline script: its full policy is enforced below,
    # with Trusted Types, so a markup injection cannot run script even if an escape is ever missed.
    <LocationMatch "^/web(/|$)">
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https://challenges.cloudflare.com; font-src 'self'; frame-src https://www.youtube-nocookie.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; require-trusted-types-for 'script'; trusted-types default xc-inert"
        # the website needs no cross-origin isolation (that is for the game's threads), and the Turnstile frame cannot load under it.
        Header always unset Cross-Origin-Embedder-Policy
    </LocationMatch>
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Embedder-Policy "require-corp"
    Header always set Cross-Origin-Resource-Policy "same-origin"

    AddType application/wasm .wasm
    AddType application/octet-stream .dat .blat
    AddType text/javascript .js .mjs

    # pre-compressed publish output (.br / .gz next to each file)
    RewriteEngine on
    RewriteCond %{HTTP:Accept-Encoding} br
    RewriteCond %{REQUEST_FILENAME}.br -f
    RewriteRule ^(.*)$ $1.br [L]
    RewriteCond %{HTTP:Accept-Encoding} gzip
    RewriteCond %{REQUEST_FILENAME}.gz -f
    RewriteRule ^(.*)$ $1.gz [L]

    # The game (and the links it copies) opens website paths at the domain root, e.g. /home/news/<slug>.
    # Send those to the /web/ site, keeping the rest of the path.
    # Page visits only: POST /users is the API's account creation (proxied to the server below) and must not be redirected.
    RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
    RewriteRule ^/((?:home|news|changelog|wiki|help|rankings|beatmapsets?|b|s|scores|teams|multiplayer|u|users|login|register|comments)(?:/.*)?)$ /web/$1 [R=301,L]

    # /web/ is a client-side app: a deep link or a reload must get index.html, not a 404.
    # Real files and the immutable asset folder keep being served as they are.
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^/web/(?!a/).* /web/index.html [L]
    <FilesMatch "\.wasm\.br$">
        ForceType application/wasm
    </FilesMatch>
    <FilesMatch "\.wasm\.gz$">
        ForceType application/wasm
    </FilesMatch>
    <FilesMatch "\.js\.(br|gz)$">
        ForceType text/javascript
    </FilesMatch>
    <FilesMatch "\.json\.(br|gz)$">
        ForceType application/json
    </FilesMatch>
    <FilesMatch "\.(dll|dat|pdb|webcil|blat)\.(br|gz)$">
        ForceType application/octet-stream
    </FilesMatch>
    <FilesMatch "\.br$">
        Header set Content-Encoding br
        Header append Vary Accept-Encoding
        SetEnv no-gzip 1
    </FilesMatch>
    <FilesMatch "\.gz$">
        Header set Content-Encoding gzip
        Header append Vary Accept-Encoding
        SetEnv no-gzip 1
    </FilesMatch>

    <LocationMatch "^/_framework/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/dev/">
        Header set Cache-Control "no-cache"
    </LocationMatch>
    <LocationMatch "^/(index\.html|main\.js|js/)?$">
        Header set Cache-Control "no-cache"
    </LocationMatch>

    # xc-osu! server (same origin): API v2, OAuth, registration, chat websocket, SignalR hubs
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        /api/          http://127.0.0.1:5080/api/
    ProxyPassReverse /api/          http://127.0.0.1:5080/api/
    ProxyPass        /oauth/        http://127.0.0.1:5080/oauth/
    ProxyPassReverse /oauth/        http://127.0.0.1:5080/oauth/
    ProxyPass        /users         http://127.0.0.1:5080/users
    ProxyPass        /notifications http://127.0.0.1:5080/notifications upgrade=websocket
    ProxyPass        /signalr/      http://127.0.0.1:5080/signalr/ upgrade=websocket timeout=120
    ProxyPassReverse /signalr/      http://127.0.0.1:5080/signalr/

    ErrorLog ${APACHE_LOG_DIR}/osu-error.log
    # %U omits query strings; omit Referer too, since it can contain token URLs.
    LogFormat "%a %l %u %t \"%m %U %H\" %>s %b" osu_no_secrets
    CustomLog ${APACHE_LOG_DIR}/osu-access.log osu_no_secrets

SSLCertificateFile /etc/letsencrypt/live/osu.xcsoftworks.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/osu.xcsoftworks.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
